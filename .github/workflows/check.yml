name: VLESS Reality RU-SNI Checker

on:
  schedule:
    # Каждый 4 часа
    - cron: '0 */4 * * *'
  workflow_dispatch:   # Можно запускать вручную
  push:
    branches: [ main, master ]
    paths:
      - 'vless_reality_ru_sni_finder.py'
      - 'requirements.txt'
      - '.github/workflows/check.yml'

permissions:
  contents: write   # Нужно, если хотим коммитить результат

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VLESS Reality RU-SNI Finder
        run: |
          python vless_reality_ru_sni_finder.py

      - name: Show result stats
        run: |
          echo "=== Результат ==="
          wc -l vless_reality_ru_sni.txt || true
          head -n 20 vless_reality_ru_sni.txt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vless-reality-ru-sni-${{ github.run_number }}
          path: vless_reality_ru_sni.txt
          retention-days: 7

      # ===== Опционально: автоматически коммитить обновлённый файл =====
      - name: Commit and push updated configs
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add vless_reality_ru_sni.txt
          
          if git diff --staged --quiet; then
            echo "Нет изменений — коммит не нужен"
          else
            git commit -m "chore: update VLESS Reality RU-SNI list $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
